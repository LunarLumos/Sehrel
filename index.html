<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Labs | Smart Ramadan 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Noto+Naskh+Arabic:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFD700;
            --accent: #bc9cff;
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(255, 215, 0, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Abstract Dynamic Background */
        .orb-1 { position: fixed; top: -10%; left: -10%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(188, 156, 255, 0.1) 0%, transparent 70%); z-index: -1; animation: float 20s infinite alternate; }
        .orb-2 { position: fixed; bottom: -10%; right: -10%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%); z-index: -1; animation: float 15s infinite alternate-reverse; }
        
        @keyframes float { from { transform: translate(0,0); } to { transform: translate(50px, 50px); } }

        header { padding: 60px 20px 30px; text-align: center; }
        .badge { background: var(--card-bg); border: 1px solid var(--border); padding: 6px 18px; border-radius: 100px; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--primary); margin-bottom: 15px; display: inline-block; }
        h1 { font-weight: 800; font-size: 3.5rem; margin: 0; letter-spacing: -2px; }

        /* Bento Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto auto;
            gap: 20px;
            max-width: 1200px;
            width: 95%;
            margin-bottom: 50px;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }

        .bento-card:hover { border-color: var(--primary); transform: scale(1.02); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }

        .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; margin-bottom: 15px; font-weight: 500; }

        /* Frame 1: Hero Countdown */
        .hero-frame { grid-column: span 2; grid-row: span 1; min-height: 220px; }
        #mainTimer { font-size: 5rem; font-weight: 800; margin: 0; line-height: 1; letter-spacing: -3px; }
        #statusTag { font-size: 1.2rem; color: var(--primary); margin-top: 10px; font-weight: 500; }

        /* Frame 2: Dynamic Dua */
        .dua-frame { grid-column: span 2; background: linear-gradient(145deg, rgba(255,255,255,0.05), transparent); }
        .dua-arabic { font-family: 'Noto Naskh Arabic', serif; font-size: 1.6rem; line-height: 1.8; color: var(--primary); text-align: right; margin-bottom: 10px; }
        .dua-eng { font-size: 0.9rem; opacity: 0.7; font-style: italic; line-height: 1.4; border-left: 2px solid var(--primary); padding-left: 15px; }

        /* Frame 3: Times */
        .times-frame { grid-column: span 1; }
        .time-row { display: flex; justify-content: space-between; margin: 8px 0; }
        .time-row span { opacity: 0.6; }
        .time-row b { color: var(--primary); font-size: 1.2rem; }

        /* Frame 4: Circular Progress */
        .progress-frame { grid-column: span 1; align-items: center; }
        .circle-svg { width: 100px; height: 100px; transform: rotate(-90deg); }
        .circle-svg circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .circle-bg { stroke: rgba(255,255,255,0.05); }
        .circle-val { stroke: var(--primary); stroke-dasharray: 283; stroke-dashoffset: 283; filter: drop-shadow(0 0 8px var(--primary)); }
        .circle-txt { position: absolute; font-size: 1.2rem; font-weight: 800; top: 55%; }

        /* Frame 5: Ashra Track */
        .ashra-frame { grid-column: span 1; }
        #ashraDisplay { font-size: 1.5rem; font-weight: 800; color: white; }
        .day-counter { font-size: 3.5rem; position: absolute; right: 20px; bottom: 0; opacity: 0.1; font-weight: 800; }

        /* Frame 6: Sunnah Tip */
        .tip-frame { grid-column: span 1; background: rgba(188, 156, 255, 0.05); }

        /* Timeline Footer */
        .timeline-box { grid-column: span 4; display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .timeline-box::-webkit-scrollbar { display: none; }
        .t-item { min-width: 110px; background: var(--card-bg); padding: 20px; border-radius: 25px; text-align: center; border: 1px solid var(--border); }
        .t-item.active { background: var(--primary); color: black; border-color: var(--primary); }
        .t-item.active * { color: black; }

        footer { padding: 40px; opacity: 0.5; font-size: 0.8rem; letter-spacing: 1px; }

        /* States */
        .state-fasting { --primary: #FFD700; --glow: rgba(255, 215, 0, 0.2); }
        .state-eating { --primary: #bc9cff; --glow: rgba(188, 156, 255, 0.2); }

        @media (max-width: 1000px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-frame, .dua-frame, .timeline-box { grid-column: span 2; }
            h1 { font-size: 2.5rem; }
        }
        @media (max-width: 600px) {
            .bento-grid { grid-template-columns: 1fr; }
            .hero-frame, .dua-frame, .times-frame, .progress-frame, .ashra-frame, .tip-frame, .timeline-box { grid-column: span 1; }
            #mainTimer { font-size: 3.5rem; }
        }
    </style>
</head>
<body class="state-fasting">

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <header>
        <div class="badge">Dhaka Tracking Active</div>
        <h1>Ramadan 2026</h1>
    </header>

    <div class="bento-grid">
        <!-- Frame 1: Countdown -->
        <div class="bento-card hero-frame">
            <span class="label" id="timerLabel">Next Event</span>
            <div id="mainTimer">00:00:00</div>
            <div id="statusTag">Calculating...</div>
        </div>

        <!-- Frame 2: Smart Dua -->
        <div class="bento-card dua-frame">
            <span class="label" id="duaLabel">Intention for Fasting</span>
            <div class="dua-arabic" id="duaArabic">...</div>
            <div class="dua-eng" id="duaMeaning">...</div>
        </div>

        <!-- Frame 3: Schedule -->
        <div class="bento-card times-frame">
            <span class="label">Today's Times</span>
            <div class="time-row"><span>Sehri</span><b id="valSehri">--:--</b></div>
            <div class="time-row"><span>Iftar</span><b id="valIftar">--:--</b></div>
        </div>

        <!-- Frame 4: Progress -->
        <div class="bento-card progress-frame">
            <span class="label">Fast Progress</span>
            <svg class="circle-svg">
                <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                <circle id="progCircle" class="circle-val" cx="50" cy="50" r="45"></circle>
            </svg>
            <div class="circle-txt" id="progText">0%</div>
        </div>

        <!-- Frame 5: Ashra -->
        <div class="bento-card ashra-frame">
            <span class="label">Current Phase</span>
            <div id="ashraDisplay">Mercy</div>
            <div class="day-counter" id="ramadanDay">01</div>
        </div>

        <!-- Frame 6: Sunnah -->
        <div class="bento-card tip-frame">
            <span class="label">Sunnah Focus</span>
            <div id="tipText" style="line-height: 1.5; font-weight: 500;">Break your fast with fresh dates and water.</div>
        </div>

        <!-- Timeline -->
        <div class="timeline-box" id="timelineBody"></div>
    </div>

    <footer>
        © 2025 Lunar Labs 🌙 | All rights reserved.
    </footer>

    <script>
        const ramadanData = [
            ["2026-02-19","05:12 AM","05:57 PM"], ["2026-02-20","05:11 AM","05:58 PM"],
            ["2026-02-21","05:11 AM","05:58 PM"], ["2026-02-22","05:10 AM","05:59 PM"],
            ["2026-02-23","05:09 AM","05:59 PM"], ["2026-02-24","05:08 AM","06:00 PM"],
            ["2026-02-25","05:08 AM","06:00 PM"], ["2026-02-26","05:07 AM","06:01 PM"],
            ["2026-02-27","05:06 AM","06:01 PM"], ["2026-02-28","05:05 AM","06:02 PM"],
            ["2026-03-01","05:04 AM","06:02 PM"], ["2026-03-02","05:04 AM","06:03 PM"],
            ["2026-03-03","05:03 AM","06:03 PM"], ["2026-03-04","05:02 AM","06:04 PM"],
            ["2026-03-05","05:01 AM","06:04 PM"], ["2026-03-06","05:00 AM","06:04 PM"],
            ["2026-03-07","04:59 AM","06:05 PM"], ["2026-03-08","04:58 AM","06:05 PM"],
            ["2026-03-09","04:57 AM","06:06 PM"], ["2026-03-10","04:56 AM","06:06 PM"],
            ["2026-03-11","04:56 AM","06:07 PM"], ["2026-03-12","04:55 AM","06:07 PM"],
            ["2026-03-13","04:54 AM","06:08 PM"], ["2026-03-14","04:53 AM","06:08 PM"],
            ["2026-03-15","04:52 AM","06:08 PM"], ["2026-03-16","04:51 AM","06:09 PM"],
            ["2026-03-17","04:50 AM","06:09 PM"], ["2026-03-18","04:49 AM","06:10 PM"],
            ["2026-03-19","04:48 AM","06:10 PM"], ["2026-03-20","04:47 AM","06:11 PM"]
        ];

        const duas = {
            sehri: {
                ar: "وَبِصَوْمِ غَدٍ نَّوَيْتُ مِنْ شَهْرِ رَمَضَانَ",
                en: "I intend to keep the fast for tomorrow in the month of Ramadan.",
                label: "Niyyah for Fasting"
            },
            iftar: {
                ar: "اللَّهُمَّ اِنِّى لَكَ صُمْتُ وَبِكَ امنْتُ وَعَلَى رِزْقِكَ اَفْطَرْتُ",
                en: "O Allah! I fasted for You and I believe in You and I break my fast with Your sustenance.",
                label: "Dua for Breaking Fast"
            }
        };

        function parse(date, time, adj) {
            let [t, mod] = time.split(' ');
            let [h, m] = t.split(':');
            if (h === '12') h = '00';
            if (mod === 'PM') h = parseInt(h) + 12;
            let d = new Date(`${date}T${String(h).padStart(2,'0')}:${m}:00`);
            d.setMinutes(d.getMinutes() + adj);
            return d;
        }

        // Setup Timeline
        const tl = document.getElementById('timelineBody');
        ramadanData.forEach((r, i) => {
            const isToday = new Date().toISOString().split('T')[0] === r[0];
            const div = document.createElement('div');
            div.className = `t-item ${isToday ? 'active' : ''}`;
            div.innerHTML = `<div style="font-size:0.7rem;opacity:0.6">DAY</div><div style="font-size:1.2rem;font-weight:800">${i+1}</div><div style="font-size:0.6rem;margin-top:5px">${r[0].split('-')[2]} MAR</div>`;
            tl.appendChild(div);
        });

        function update() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const idx = ramadanData.findIndex(d => d[0] === todayStr);

            if (idx === -1) {
                document.getElementById('mainTimer').innerText = "LIVE 2026";
                document.getElementById('statusTag').innerText = "Not in Ramadan Cycle";
                return;
            }

            const sehri = parse(ramadanData[idx][0], ramadanData[idx][1], -1);
            const iftar = parse(ramadanData[idx][0], ramadanData[idx][2], 1);
            
            let target, label, status, currentDua, theme;

            if (now < sehri) {
                target = sehri; label = "Sehri Ends In"; status = "Prepare for Fasting"; currentDua = duas.sehri; theme = "state-eating";
            } else if (now < iftar) {
                target = iftar; label = "Iftar Starts In"; status = "Fasting Mode"; currentDua = duas.iftar; theme = "state-fasting";
                // Progress
                const perc = Math.floor(((now - sehri)/(iftar - sehri))*100);
                document.getElementById('progCircle').style.strokeDashoffset = 283 - (283 * perc / 100);
                document.getElementById('progText').innerText = perc + "%";
            } else {
                const next = ramadanData[idx+1];
                target = next ? parse(next[0], next[1], -1) : null;
                label = "Next Suhoor In"; status = "Iftar Completed"; currentDua = duas.sehri; theme = "state-eating";
                document.getElementById('progCircle').style.strokeDashoffset = 0;
                document.getElementById('progText').innerText = "100%";
            }

            // Apply Updates
            document.body.className = theme;
            document.getElementById('timerLabel').innerText = label;
            document.getElementById('statusTag').innerText = status;
            document.getElementById('duaLabel').innerText = currentDua.label;
            document.getElementById('duaArabic').innerText = currentDua.ar;
            document.getElementById('duaMeaning').innerText = currentDua.en;
            document.getElementById('valSehri').innerText = sehri.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('valIftar').innerText = iftar.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('ramadanDay').innerText = String(idx + 1).padStart(2,'0');

            if (target) {
                const diff = target - now;
                const h = String(Math.floor(diff / 3600000)).padStart(2,'0');
                const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
                document.getElementById('mainTimer').innerText = `${h}:${m}:${s}`;
            }

            // Ashra Logic
            const ashra = idx < 10 ? "Mercy" : (idx < 20 ? "Forgiveness" : "Protection");
            document.getElementById('ashraDisplay').innerText = ashra;
        }

        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
